<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARPE – Relatório de Evangelização</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0d2a44;--mut:#55677c;--line:#d5d9e2;--pri:#063d66;--pri2:#063d66;--priT:#d5d9e2;--soft:#f3f5f9;--onpri:#fff;--ok:#1f8a4c;--info:#1d6fd6;--warn:#b07800;--bad:#c0392b;--sh:0 1px 3px rgba(6,61,102,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17202f;--ink:#e8edf6;--mut:#9aa8c2;--line:#2a3550;--pri:#9cc4f7;--pri2:#9cc4f7;--priT:#22304a;--soft:#1b2740;--onpri:#0b1526;--ok:#3cc77a;--info:#5aa2ff;--warn:#e6b422;--bad:#ef6a5b;--sh:0 1px 3px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17202f;--ink:#e8edf6;--mut:#9aa8c2;--line:#2a3550;--pri:#9cc4f7;--pri2:#9cc4f7;--priT:#22304a;--soft:#1b2740;--onpri:#0b1526;--ok:#3cc77a;--info:#5aa2ff;--warn:#e6b422;--bad:#ef6a5b;--sh:0 1px 3px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.2}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--priT);color:var(--pri);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:60px;box-shadow:var(--sh)}
header.top .brand{font-weight:700;font-size:20px;line-height:1.1}
header.top .sub{font-size:12px;opacity:.85}
header.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:rgba(6,61,102,.12);color:var(--pri);white-space:nowrap}
:root[data-theme="dark"] .pill,:root[data-theme="dark"] .usel{background:rgba(255,255,255,.1)}
.usel{background:rgba(6,61,102,.12);color:var(--pri);border:0;border-radius:8px;padding:6px 8px;max-width:130px;font-size:13px}
.usel option{color:#000}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--priT);box-shadow:0 -1px 4px rgba(6,61,102,.25);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav#nav button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:12px;color:var(--pri);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
nav#nav button.on{font-weight:700}
nav#nav button.on .ic{background:rgba(6,61,102,.16);border-radius:999px;padding:3px 14px;margin:-3px 0}
nav#nav .desk{display:none}
main{max-width:1000px;margin:0 auto;padding:16px 14px 100px}
.h1{font-size:24px;font-weight:700;margin:4px 0 2px;color:var(--pri)}
.muted{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.demo{background:#fff6dc;color:#5a4300;border:1px solid #f0d98a;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile2{display:flex;flex-direction:column;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--priT);box-shadow:var(--sh)}
.tile2 .top{background:var(--soft);height:120px;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.tile2 .lab{padding:14px 8px 22px;font-weight:700;color:var(--pri);text-align:center}
.menu{display:grid;gap:8px;margin:16px 0}
.mbtn{background:var(--priT);color:var(--pri);border:0;border-radius:6px;padding:16px;font-weight:700;font-size:17px;letter-spacing:.03em;box-shadow:var(--sh)}
.foot{text-align:center;margin-top:26px;font-size:14px}
.cover-card{padding:24px 18px 22px;text-align:center}
.emblem{padding:6px 12px 18px;margin:2px auto 22px;max-width:320px}
.emblem b{display:block;font-size:23px;letter-spacing:.05em;color:var(--pri)}
.emblem span{display:block;font-size:11px;color:var(--mut);margin-top:5px;text-transform:uppercase;letter-spacing:.05em}
.tiles3{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 14px}
.tile3{display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;width:88px;text-align:center}
.tile3 .circ{width:60px;height:60px;border-radius:50%;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:var(--sh)}
.tile3 b{font-size:13px;color:var(--pri);display:block}
.tile3 small{font-size:10.5px;color:var(--mut);display:block;margin-top:3px;line-height:1.25}
.darkrow{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);border-radius:12px;margin:12px 0;box-shadow:var(--sh);font-size:15px;color:var(--ink)}
.switch{position:relative;width:42px;height:23px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .sl{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s;cursor:pointer}
.switch .sl:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+.sl{background:var(--pri)}
.switch input:checked+.sl:before{transform:translateX(19px)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--sh)}
.kpi .n{font-size:28px;font-weight:700;color:var(--pri)}
.kpi .l{font-size:13px;color:var(--mut)}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:8px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--priT);color:var(--pri);border:0}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters label,.fm label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;font-weight:600}
.filters .wide,.fm .wide{grid-column:1/-1}
select,input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=search],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;min-height:42px;color:var(--ink)}
textarea{min-height:70px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;box-shadow:var(--sh)}
.item:hover{border-color:var(--pri)}
.item .t{font-weight:600;color:var(--pri)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--priT);color:var(--pri)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:currentColor}
.st.ativa{color:var(--ok)}.st.desativada{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{background:var(--priT);color:var(--pri);border:0;border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:14px;font-weight:600}
.tabs button.on{background:var(--pri);color:var(--onpri)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.cal button{background:var(--soft);border:1px solid var(--line);border-radius:8px;min-height:52px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.cal button.today{border-color:var(--pri);border-width:2px}
.cal button.sel{background:var(--priT)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:7px;height:7px;border-radius:50%;display:block}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bar .lb{flex:0 0 42%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:var(--priT);border-radius:6px;height:16px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.bar .v{width:32px;text-align:right;font-weight:600}
.mchart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:6px}
.mchart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mchart .bs{display:flex;gap:3px;align-items:flex-end;height:110px}
.mchart .bs i{width:14px;border-radius:3px 3px 0 0;display:block}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--priT);color:var(--pri);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--pri)}
.sh-f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:0;background:var(--card);padding-top:8px}
.x{background:none;border:0;font-size:20px;padding:6px 10px;color:var(--pri)}
.fm{display:grid;grid-template-columns:1fr;gap:10px}
.fm h3{font-size:14px;color:var(--pri);margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{flex-direction:row;align-items:center;gap:6px;background:var(--priT);border-radius:8px;padding:6px 10px;font-size:14px;color:var(--ink);font-weight:500}
.recrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;position:relative}
.recrow .x{position:absolute;right:2px;top:-2px}
.recrow label{font-size:11px}
.err{color:var(--bad);font-size:14px;margin-top:8px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;max-width:90%}
.mapbox{background:var(--priT);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:8px 0}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hist{border-left:3px solid var(--line);margin-left:6px;padding-left:12px}
.hist .h{margin:0 0 12px;cursor:pointer}
@media (min-width:900px){
 nav#nav{top:calc(60px + env(safe-area-inset-top,0px));bottom:0;right:auto;width:210px;flex-direction:column;box-shadow:1px 0 4px rgba(6,61,102,.2);padding:10px 8px;justify-content:flex-start}
 nav#nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px;justify-content:flex-start;min-height:44px}
 nav#nav button.on{background:rgba(6,61,102,.16)}
 nav#nav button.on .ic{background:none;padding:0;margin:0}
 nav#nav .mob{display:none}
 nav#nav .desk{display:flex}
 main{padding-left:230px;max-width:none;padding-right:20px}
 main>.in{max-width:900px;margin:0 auto}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .filters{grid-template-columns:repeat(4,1fr)}
 .fm{grid-template-columns:1fr 1fr}
 .recrow{grid-template-columns:repeat(5,1fr) 30px}
 .ov{align-items:center}
 .sheet{border-radius:16px}
 .toast{bottom:30px}
}
@media print{header.top,nav#nav,.noprint,.toast{display:none!important}main{padding:0!important}body{background:#fff;color:#000}.card{border:0;box-shadow:none}}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .2s}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">DARPE</div><div class="sub">Relatório de Evangelização</div></div>
  <div class="sp"></div>
  <span class="pill" id="sync" role="status"></span>
  <span id="authbox"></span>
</header>
<main id="main"></main>
<nav id="nav" aria-label="Menu principal"></nav>
<script>
"use strict";
/* ============ Utilidades ============ */
const KEY="darpe_evang_db_v5",AKEY="darpe_evang_auth_v1";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const TODAY=ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const fmtD=s=>s?s.split("-").reverse().join("/"):"";
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ST={ativa:{l:"Ativa",c:"#1f8a4c"},desativada:{l:"Desativada",c:"#c0392b"}};
const SCOL=["#1d4e89","#2a9d8f","#b5651d","#7a4fa3","#5c6b7a","#c2457a"];

const ICONS={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',building:'<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6M9 11h.01M15 11h.01"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3.2-6 7-6s7 2 7 6M17 5a3.5 3.5 0 0 1 0 7M22 21c0-3-1.7-5-4.5-5.7"/>',sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const APP_VER="1.2.0",APP_DATE="22/09/2026";
const THEME_KEY="darpe_evang_theme_v1";
function applyTheme(){let t="";try{t=localStorage.getItem(THEME_KEY)||""}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":t==="light"?"light":"")}
applyTheme();
const DOW=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function recRow(r){r=r||{tipo:"semanal"};return `<div class="recrow"><label>Repete<select data-r="tipo">${[["semanal","Toda semana"],["quinzenal","A cada 2 semanas"],["mensal","Todo mês"]].map(o=>`<option value="${o[0]}"${r.tipo===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></label><label>Dia da semana<select data-r="dow"><option value="">—</option>${DOW.map((d,x)=>`<option value="${x}"${r.dow===x?" selected":""}>${d}</option>`).join("")}</select></label><label>Horário<input type="time" data-r="hora" value="${esc(r.hora||"")}"></label><label>Semanas do mês<input type="text" data-r="nth" placeholder="2 ou 2,4 (5 = último)" value="${esc((r.nth||[]).join(","))}"></label><label>Data de referência<input type="date" data-r="ancora" value="${esc(r.ancora||"")}"></label><button type="button" class="x" data-recdel aria-label="Remover linha">✕</button></div>`}
function recText(i){
  const rec=i.rec||[];if(!rec.length)return "";
  const g={};rec.forEach(r=>{const k=[r.tipo,r.dow,(r.nth||[]).join(),r.ancora||""].join("|");(g[k]=g[k]||{r,h:[]}).h.push(r.hora)});
  return Object.values(g).map(({r,h})=>{const d=DOW[r.dow].toLowerCase(),m=r.dow===0||r.dow===6,hh=h.sort().join(", ");
    if(r.tipo==="semanal")return `${m?"Todo":"Toda"} ${d}, ${hh}`;
    if(r.tipo==="quinzenal")return `A cada 2 semanas, ${d}, ${hh}`;
    return `${(r.nth||[]).map(n=>n===5?"último":n+"º").join(" e ")} ${d} do mês, ${hh}`}).join(" · ")}
function occ(i,from,to){const out=[];
  for(let d=from;d<=to;d=addDays(d,1)){const dt=new Date(d+"T12:00:00"),w=dt.getDay(),dm=dt.getDate(),last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
    (i.rec||[]).forEach(r=>{if(r.dow!==w)return;let ok=false;
      if(r.tipo==="semanal")ok=true;
      else if(r.tipo==="quinzenal")ok=!!r.ancora&&((Math.round((dt-new Date(r.ancora+"T12:00:00"))/864e5)%14)+14)%14===0;
      else ok=(r.nth||[]).some(n=>n===5?dm+7>last:Math.ceil(dm/7)===n);
      if(ok)out.push({data:d,ini:r.hora})})}
  return out.sort((a,b)=>(a.data+a.ini).localeCompare(b.data+b.ini))}
function genPlan(ids,days){const to=addDays(TODAY,days),plan=[];
  ids.forEach(id=>{const i=byId("instituicoes",id);if(!i||i.status==="inativo")return;
    occ(i,TODAY,to).forEach(o=>{if(!T("reunioes").some(m=>m.instituicao_id===i.id&&m.data===o.data&&m.ini===o.ini))plan.push({i,data:o.data,ini:o.ini})})});return plan}
function genSheet(ids){
  const ov=openSheet("Gerar reuniões programadas",`<label style="font-size:12px;color:var(--mut);font-weight:600">Período<select id="gdays"><option value="30">Próximos 30 dias</option><option value="60">Próximos 60 dias</option><option value="90">Próximos 90 dias</option></select></label><div id="gprev" style="margin:10px 0"></div><div class="sh-f"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="gok">Criar reuniões</button></div>`);
  const upd=()=>{const p=genPlan(ids,+ov.querySelector("#gdays").value);
    ov.querySelector("#gprev").innerHTML=p.length?`<b>${p.length}</b> reunião(ões) serão criadas como “Programada”. O que já existe não é duplicado.<br><span class="muted">${p.slice(0,6).map(x=>fmtD(x.data)+" "+x.ini+" – "+esc(x.i.nome)).join("<br>")}${p.length>6?"<br>…":""}</span>`:"Nenhuma reunião nova neste período, ou as instituições não têm recorrência cadastrada.";
    ov.querySelector("#gok").disabled=!p.length};
  ov.querySelector("#gdays").addEventListener("change",upd);upd();
  ov.querySelector("#gok").addEventListener("click",()=>{const p=genPlan(ids,+ov.querySelector("#gdays").value);
    p.forEach(x=>T("reunioes").push({id:nextId("reunioes"),instituicao_id:x.i.id,data:x.data,ini:x.ini,fim:"",responsavel:"",colaboradores:[],participantes:"",tipo:"Regular",status:"ativa",obs:"Gerada pela recorrência"}));
    logAct("Gerou reuniões pela recorrência",p.length+" reunião(ões)");persist();ov.remove();render(true);toast(p.length+" reunião(ões) criada(s)")})}

function fieldHtml(f,v){
  const val=v[f.k]??f.def??"";
  if(f.t==="h")return `<h3 class="wide">${esc(f.l)}</h3>`;
  if(f.t==="note")return `<div class="muted wide">${f.l}</div>`;
  if(f.t==="html")return `<div class="wide">${f.l}</div>`;
  if(f.t==="rec")return `<div class="wide" data-rec="${f.k}"><div class="muted" style="font-weight:600;font-size:12px;margin-bottom:4px">${esc(f.l)}</div><div class="recs">${(v[f.k]||[]).map(recRow).join("")}</div><button type="button" class="btn ghost sm" data-recadd>+ Adicionar dia e horário</button></div>`;
  const w=f.wide?"wide":"";
  if(f.t==="select"){const o=f.optsFn?f.optsFn(v[f.dep]):f.opts;
    return `<label class="${w}">${esc(f.l)}${f.req?" *":""}<select name="${f.k}"><option value="">—</option>${o.map(x=>`<option value="${esc(x[0])}"${String(val)===String(x[0])?" selected":""}>${esc(x[1])}</option>`).join("")}</select></label>`}
  if(f.t==="textarea")return `<label class="wide">${esc(f.l)}<textarea name="${f.k}">${esc(val)}</textarea></label>`;
  if(f.t==="multi"){const sel=(v[f.k]||[]).map(String);
    return `<div class="wide"><div class="muted" style="font-weight:600;font-size:12px;margin-bottom:4px">${esc(f.l)}</div><div class="chk" data-multi="${f.k}">${f.opts.map(o=>`<label><input type="checkbox" value="${o[0]}"${sel.includes(String(o[0]))?" checked":""}>${esc(o[1])}</label>`).join("")||'<span class="muted">Nenhum colaborador cadastrado.</span>'}</div></div>`}
  return `<label class="${w}">${esc(f.l)}${f.req?" *":""}<input type="${f.t||"text"}" name="${f.k}" value="${esc(val)}"${f.step?` step="${f.step}"`:""}></label>`}
function openForm(title,fields,vals,onSave){
  const ov=openSheet(esc(title),`<div class="fm">${fields.map(f=>fieldHtml(f,vals)).join("")}</div><div class="err" id="ferr"></div><div class="sh-f"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="fsave">Salvar</button></div>`);
  ov.addEventListener("click",e=>{const ad=e.target.closest("[data-recadd]");if(ad){ad.parentElement.querySelector(".recs").insertAdjacentHTML("beforeend",recRow());return}const dl=e.target.closest("[data-recdel]");if(dl)dl.closest(".recrow").remove()});
  fields.filter(f=>f.dep).forEach(f=>{
    const src=ov.querySelector(`[name="${f.dep}"]`),dst=ov.querySelector(`[name="${f.k}"]`);
    src.addEventListener("change",()=>{dst.innerHTML='<option value="">—</option>'+f.optsFn(src.value).map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join("")});
    dst.innerHTML='<option value="">—</option>'+f.optsFn(src.value||vals[f.dep]).map(x=>`<option value="${esc(x[0])}"${String(vals[f.k]||"")===String(x[0])?" selected":""}>${esc(x[1])}</option>`).join("")});
  ov.querySelector("#fsave").addEventListener("click",()=>{
    const out={},err=[];
    fields.forEach(f=>{if(!f.k)return;
      if(f.t==="rec"){const rows=[...ov.querySelectorAll(`[data-rec="${f.k}"] .recrow`)].map(row=>{const g=k=>row.querySelector(`[data-r="${k}"]`).value.trim();return{tipo:g("tipo"),dow:g("dow")===""?"":+g("dow"),hora:g("hora"),nth:g("nth").split(/[^0-9]+/).filter(Boolean).map(Number),ancora:g("ancora")}});
        rows.forEach((r,ix)=>{const n=" (linha "+(ix+1)+")";
          if(r.dow==="")err.push("Escolha o dia da semana"+n+".");
          if(!r.hora)err.push("Informe o horário"+n+".");
          if(r.tipo==="mensal"&&(!r.nth.length||r.nth.some(x=>x<1||x>5)))err.push("Informe as semanas do mês, de 1 a 5"+n+".");
          if(r.tipo==="quinzenal"){if(!r.ancora)err.push("Informe a data de referência"+n+".");else if(r.dow!==""&&new Date(r.ancora+"T12:00:00").getDay()!==r.dow)err.push("A data de referência deve cair no dia da semana escolhido"+n+".")}
          if(r.tipo!=="mensal")r.nth=[];if(r.tipo!=="quinzenal")r.ancora=""});
        out[f.k]=rows;return}
      if(f.t==="multi"){out[f.k]=[...ov.querySelectorAll(`[data-multi="${f.k}"] input:checked`)].map(x=>+x.value);return}
      const el=ov.querySelector(`[name="${f.k}"]`);let v=el.value.trim();
      if(f.req&&!v)err.push(`Preencha: ${f.l}.`);
      if(f.t==="number"&&v!==""){v=+v;if(isNaN(v)||(f.min!=null&&v<f.min))err.push(`Valor inválido em: ${f.l}.`)}
      out[f.k]=v});
    if(out.ini&&out.fim&&out.fim<out.ini)err.push("O horário de término deve ser depois do início.");
    if(out.email&&!/^\S+@\S+\.\S+$/.test(out.email))err.push("E-mail inválido.");
    if(err.length){ov.querySelector("#ferr").textContent=err.join(" ");return}
    if(onSave(out)!==false){ov.remove()}});
}

V.pesquisar=()=>{const f=F("pq");return `<div class="in"><h1 class="h1">Pesquisar</h1><p class="muted">Combine quantos filtros quiser. Digite só parte do nome para achar a instituição.</p>
  <div class="card">${filterBar("pq",["q","regiao","darpe","cidade","setor","sub","inst","status","per","de","ate"])}</div><div id="res"></div></div>`};
function resPesquisar(){
  const f=F("pq"),mf=hasMeetF(f);
  let list=T("instituicoes").filter(i=>instOk(i,f));
  if(mf){const ms=meetsFor(f);const ids=new Set(ms.map(m=>m.instituicao_id));list=list.filter(i=>ids.has(i.id));
    return `<p class="muted">${list.length} instituição(ões) · ${ms.length} reunião(ões)</p>`+(list.length?list.map(i=>instCard(i,ms.filter(m=>m.instituicao_id===i.id).length+" reunião(ões) no filtro")).join(""):empty("Nada encontrado com esses filtros."))}
  return `<p class="muted">${list.length} instituição(ões)</p>`+(list.length?list.map(i=>instCard(i)).join(""):empty("Nada encontrado com esses filtros."))}

V.instituicoes=()=>`<div class="in"><h1 class="h1">Instituições</h1>
  <div class="card">${filterBar("il",["q","cidade","setor","sub"])}</div><div id="res"></div></div>`;
function resInst(){const f=F("il");const l=T("instituicoes").filter(i=>instOk(i,f)).sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<p class="muted">${l.length} instituição(ões)</p>`+(l.map(i=>instCard(i)).join("")||empty("Nenhuma instituição encontrada."))}

V.instDetail=()=>{
  const i=byId("instituicoes",S.p.id);if(!i)return empty("Instituição não encontrada.");
  const ms=T("reunioes").filter(m=>m.instituicao_id===i.id).sort((a,b)=>sortM(b,a));
  const sub=i.subcategoria_id?byId("subcategorias",i.subcategoria_id):null;
  const end=[i.endereco,i.numero,i.bairro,cidadeNome(i),i.cep].filter(Boolean).join(", ");
  const has=i.latitude!==""&&i.latitude!=null&&i.longitude!==""&&i.longitude!=null;

  return `<div class="in"><button class="btn ghost sm" data-act="go" data-v="instituicoes">← Instituições</button>
  <div class="card"><h1 class="h1" style="font-size:22px">esc(i.nome)}</h1>
  <div class="muted">${setorNome(i)} – ${esc(byId("setores",i.setor_id)?.nome||"")}${sub?" · "+esc(sub.nome):""}<br>${esc(cidadeNome(i))}${i.demo?" · <b>DADOS DE DEMONSTRAÇÃO</b>":""}</div>
  <table style="margin-top:10px"><tr><th>Endereço</th><td>${esc(end||"—")}</td></tr><tr><th>Telefone</th><td>${esc(i.telefone||"—")}</td></tr><tr><th>E-mail</th><td>${esc(i.email||"—")}</td></tr>
  <tr><th>Resp. da instituição</th><td>${esc(i.resp_inst||"—")}</td></tr><tr><th>Resp. atendimento</th><td>${esc(i.resp_atend||"—")}</td></tr>
  <tr><th>Dia e horário</th><td>${esc(diaHora(i)||"Não definido")}</td></tr>
  ${i.obs_evang||i.obs_contato?`<tr><th>Observações</th><td>${esc([i.obs_contato,i.obs_evang].filter(Boolean).join(" | "))}</td></tr>`:""}</table>
  <div class="row" style="margin-top:12px">${can.meet()?`<button class="btn" data-act="newMeet" data-id="${i.id}">+ Nova reunião</button>`:""}
  ${has?`<a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${i.latitude},${i.longitude}">Traçar rota</a>`:""}
  ${can.inst(i)?`<button class="btn ghost" data-act="editInst" data-id="${i.id}">Editar</button>`:""}
  ${can.inst(i)&&(i.rec||[]).length?`<button class="btn ghost" data-act="genInst" data-id="${i.id}">Gerar reuniões programadas</button>`:""}
  ${can.del()?`<button class="btn bad" data-act="delInst" data-id="${i.id}">Excluir</button>`:""}</div></div>
  <h2 style="font-size:18px;margin:16px 0 8px">Histórico</h2>
  <div class="hist">${ms.map(m=>`<div class="h" data-act="meet" data-id="${m.id}" tabindex="0"><b>${fmtD(m.data)}</b> ${stHtml(m.status)}<div class="muted">Responsável: ${esc(m.responsavel||"—")}</div></div>`).join("")||'<span class="muted">Sem reuniões registradas.</span>'}</div></div>`};

/* Agenda */
V.agenda=()=>{
  const{y,m}=S.cal;
  const modes=[["mes","Mês"],["hoje","Hoje"],["semana","Esta semana"],["prox","Próximas"]];
  return `<div class="in"><h1 class="h1">Agenda</h1>
  <div class="tabs">${modes.map(x=>`<button class="${S.agMode===x[0]?"on":""}" data-act="agMode" data-m="${x[0]}">${x[1]}</button>`).join("")}</div>
  ${can.inst()?`<div class="row" style="margin-bottom:8px"><button class="btn ghost sm" data-act="genAll">Gerar reuniões pela recorrência</button></div>`:""}
  <details class="card"><summary style="font-weight:600;cursor:pointer">Filtros</summary><div style="margin-top:10px">${filterBar("ag",["regiao","darpe","cidade","setor","inst","resp"])}</div></details>
  <div id="res"></div></div>`};
function resAgenda(){
  const f=F("ag"),all=meetsFor(f);
  if(S.agMode!=="mes"){
    const r=S.agMode==="hoje"?[TODAY,TODAY]:S.agMode==="semana"?range({per:"semana"}):[TODAY,"9999"];
    const l=all.filter(m=>m.data>=r[0]&&m.data<=r[1]&&(S.agMode!=="prox"||m.status==="ativa"));
    return `<p class="muted">${l.length} reunião(ões)</p>`+(l.map(x=>meetRow(x)).join("")||empty("Nenhuma reunião neste período."))}
  const{y,m}=S.cal,first=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();

function scope(){return{}}
function painel(){
  const insts=T("instituicoes").filter(i=>instOk(i,scope())),ids=new Set(insts.map(i=>i.id)),ms=T("reunioes").filter(m=>ids.has(m.instituicao_id)),k=kpiSet(insts,ms);
  const kp=[[k.ti,"Total de instituições"],[k.ia,"Instituições ativas"],[k.tr,"Total de reuniões"],[k.at,"Reuniões ativas"],[k.dt,"Reuniões desativadas"],[k.tc,"Colaboradores"],[k.pe,"Ativas com data passada"]];
  const bars=(rows,col)=>{const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map((r,x)=>`<div class="bar"><span class="lb">${esc(r[0])}</span><span class="tr"><span class="fl" style="display:block;width:${r[1]/mx*100}%;background:${col||SCOL[x%SCOL.length]}"></span></span><span class="v">${r[1]}</span></div>`).join("")};
  const st=T("setores").map(s=>["Setor "+s.id,insts.filter(i=>i.setor_id===s.id).length]);
  const ct=T("cidades").map(c=>[c.nome+"/"+c.uf,insts.filter(i=>i.cidade_id===c.id).length]).sort((a,b)=>b[1]-a[1]);
  const meses=[...new Set(ms.map(m=>m.data.slice(0,7)))].sort().slice(-6);
  const mx=Math.max(1,...meses.map(x=>ms.filter(m=>m.data.startsWith(x)).length));
  const ch=meses.map(x=>{const tt=ms.filter(m=>m.data.startsWith(x)).length,dz=ms.filter(m=>m.data.startsWith(x)&&m.status==="desativada").length;
    return `<div class="m"><div class="bs"><i style="height:${tt/mx*100}%;background:var(--ok)" title="Total ${tt}"></i><i style="height:${dz/mx*100}%;background:var(--bad)" title="Desativadas ${dz}"></i></div><span class="muted" style="font-size:11px">${p2(+x.slice(5))}/${x.slice(2,4)}</span><span style="font-size:11px">${tt} · ${dz}</span></div>`}).join("");
  return `<div class="kpis">${kp.map(x=>`<div class="kpi"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("")}</div>
  <div class="card"><h3>Instituições por setor</h3>${bars(st)}</div>
  <div class="card"><h3>Instituições por cidade</h3>${bars(ct,"var(--pri)")}</div>
  <div class="card"><h3>Evolução mensal de reuniões</h3><div class="leg"><span><i style="background:var(--ok)"></i>Total</span><span><i style="background:var(--bad)"></i>Desativadas</span></div><div class="mchart">${ch||'<span class="muted">Sem dados.</span>'}</div></div>`}
function relTab(){
  const f=F("rl"),tipo=S.p.tipo||"geral";
  const tipos=[["geral","Relatório Geral"],["setor","Relatório por Setor"],["cidade","Relatório por Cidade"],["instituicao","Relatório por Instituição"],["reunioes","Relatório de Reuniões"],["colab","Relatório de Colaboradores"]];
  return `<div class="card noprint"><label style="font-size:12px;color:var(--mut);font-weight:600">Tipo de relatório<select data-tipo>${tipos.map(t=>`<option value="${t[0]}"${t[0]===tipo?" selected":""}>${t[1]}</option>`).join("")}</select></label><div style="margin-top:10px">${filterBar("rl",["regiao","darpe","cidade","setor","inst","resp","de","ate"])}</div>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="gen">Gerar relatório</button></div></div><div id="rep">${S.rep?repHtml(S.rep):""}</div>`}
function buildRep(tipo,f0){
  const f={...f0,...scope()};
  const insts=T("instituicoes").filter(i=>instOk(i,f)),ids=new Set(insts.map(i=>i.id));
  const ms=T("reunioes").filter(m=>ids.has(m.instituicao_id)&&meetOk(m,f)).sort(sortM);
  const c=(arr,s)=>arr.filter(m=>m.status===s).length;
  const sumHead=["Instituições","Reuniões","Ativas","Desativadas"];
  const sum=(is,mm)=>[is.length,mm.length,c(mm,"ativa"),c(mm,"desativada")];
  const meetRows=mm=>mm.map(m=>{const i=byId("instituicoes",m.instituicao_id);return[fmtD(m.data),m.ini+(m.fim?"–"+m.fim:""),i.nome,setorNome(i),cidadeNome(i),m.responsavel,ST[m.status].l,m.participantes===""?"":m.participantes]});
  const mh=["Data","Horário","Instituição","Setor","Cidade","Responsável","Situação","Participantes"];
  let title,head,rows;
  if(tipo==="geral"){title="Relatório Geral";head=mh;rows=meetRows(ms);rows.unshift(["RESUMO","","Instituições: "+insts.length,"Reuniões: "+ms.length,"Ativas: "+c(ms,"ativa"),"Desativadas: "+c(ms,"desativada"),"",""])}
  else if(tipo==="setor"){title="Relatório por Setor";head=["Setor",...sumHead];rows=T("setores").map(s=>{const is=insts.filter(i=>i.setor_id===s.id),m2=ms.filter(m=>is.some(i=>i.id===m.instituicao_id));return["Setor "+s.id+" – "+s.nome,...sum(is,m2)]})}
  else if(tipo==="cidade"){title="Relatório por Cidade";head=["Cidade",...sumHead];rows=T("cidades").map(x=>{const is=insts.filter(i=>i.cidade_id===x.id),m2=ms.filter(m=>is.some(i=>i.id===m.instituicao_id));return[x.nome+"/"+x.uf,...sum(is,m2)]})}
  else if(tipo==="instituicao"){title="Relatório por Instituição";head=["Instituição","Setor","Cidade","Reuniões","Ativas","Desativadas","Última reunião"];
    rows=insts.map(i=>{const mm=ms.filter(m=>m.instituicao_id===i.id),u=mm[mm.length-1];return[i.nome,setorNome(i),cidadeNome(i),mm.length,c(mm,"ativa"),c(mm,"desativada"),u?fmtD(u.data):"—"]})}
  else if(tipo==="reunioes"){title="Relatório de Reuniões";head=mh;rows=meetRows(ms)}
  else{title="Relatório de Colaboradores";head=["Colaborador","Telefone","Reuniões","Ativas"];rows=T("colaboradores").map(x=>{const mm=ms.filter(m=>(m.colaboradores||[]).includes(x.id));return[x.nome,x.telefone||"",mm.length,c(mm,"ativa")]})}
  return{title,head,rows,ger:new Date().toLocaleString("pt-BR"),demo:insts.some(i=>i.demo)}}
function repHtml(r){

  <h2 style="margin-top:6px;font-size:18px">DARPE – ${esc(r.title)}</h2><div class="muted">Gerado em ${esc(r.ger)}${r.demo?" · contém DADOS DE DEMONSTRAÇÃO":""}</div>

  editInst:d=>formInst(byId("instituicoes",d.id)),
  delInst:d=>{const i=byId("instituicoes",d.id);const n=T("reunioes").filter(m=>m.instituicao_id===i.id).length;
    if(!confirm(`Excluir "${i.nome}"${n?` e suas ${n} reunião(ões)`:""}? Esta ação não pode ser desfeita.`))return;
    db.reunioes=db.reunioes.filter(m=>m.instituicao_id!==i.id);db.instituicoes=db.instituicoes.filter(x=>x.id!==i.id);logAct("Excluiu instituição",i.nome);persist();go("instituicoes")},
  newMeet:d=>formMeet(null,+d.id),
  newMeetDay:()=>{formMeet(null,"");},
  editMeet:d=>{closeAll();formMeet(byId("reunioes",d.id))},
  delMeet:d=>{const m=byId("reunioes",d.id);if(!confirm("Excluir esta reunião? Esta ação não pode ser desfeita."))return;
    db.reunioes=db.reunioes.filter(x=>x.id!==m.id);logAct("Excluiu reunião",fmtD(m.data));persist();closeAll();render(true)},
  setStatus:d=>{const m=byId("reunioes",d.id);m.status=d.s;logAct("Alterou situação para "+ST[d.s].l,fmtD(m.data)+" – "+byId("instituicoes",m.instituicao_id).nome);persist();closeAll();render(true);toast("Situação atualizada")},
  clearF:d=>{S.f[d.id]={};render(true)},
  agMode:d=>{S.agMode=d.m;render(true)},
  calNav:d=>{let{y,m}=S.cal;m+=+d.n;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m};render(true)},
  calDay:d=>{S.sel=d.d;refreshRes()},
  tab:d=>{S.p.tab=d.t;render(true)},
  gen:()=>{S.rep=buildRep(S.p.tipo||"geral",F("rl"));document.getElementById("rep").innerHTML=repHtml(S.rep)},
  print:()=>{try{window.print()}catch(e){toast("Impressão indisponível aqui. Use Copiar p/ Excel.")}},
  copyrep:()=>{const r=S.rep;copyText([r.head,...r.rows].map(x=>x.join("\t")).join("\n"))},
  newColab:()=>openForm("Novo colaborador",colabFields,{status:"ativo"},o=>{o.id=nextId("colaboradores");T("colaboradores").push(o);logAct("Cadastrou colaborador",o.nome);persist();render(true)}),
  editColab:d=>{const c=byId("colaboradores",d.id);openForm("Editar colaborador",colabFields,c,o=>{Object.assign(c,o);logAct("Editou colaborador",c.nome);persist();render(true)})},
  delColab:d=>{const c=byId("colaboradores",d.id);if(!confirm(`Excluir "${c.nome}"?`))return;db.colaboradores=db.colaboradores.filter(x=>x.id!==c.id);db.reunioes.forEach(m=>m.colaboradores=(m.colaboradores||[]).filter(x=>x!==c.id));logAct("Excluiu colaborador",c.nome);persist();render(true)},
  admAdd:d=>admForm(d.k),
  admEdit:d=>admForm(d.k,byId(ADM[d.k].t,d.id)),
  admDel:d=>{const c=ADM[d.k],r=byId(c.t,d.id);
    const used=(REFS[d.k]||[]).some(([t,k])=>T(t).some(x=>String(x[k])===String(r.id)));
    if(used){toast("Registro em uso. Marque como inativo em vez de excluir.");return}
    if(d.k==="usuarios"&&r.id===S.user.id){toast("Você não pode excluir o usuário atual.");return}
    if(!confirm(`Excluir "${r.nome}"?`))return;
    db[c.t]=db[c.t].filter(x=>x.id!==r.id);logAct("Excluiu em "+c.tit,r.nome);persist();render(true)},
  exportDb:()=>{document.getElementById("bk").value=JSON.stringify(db)},
  copyBk:()=>{const v=document.getElementById("bk").value||JSON.stringify(db);copyText(v)},
  importDb:()=>{const v=document.getElementById("bk").value.trim();if(!v){toast("Cole o backup no campo");return}
    try{const n=JSON.parse(v);if(!n.instituicoes||!n.reunioes||!n.setores)throw 0;if(!confirm("Substituir todos os dados atuais pelo backup?"))return;db=n;persist();S.user=resolveUser();render();toast("Backup restaurado")}catch(e){toast("Backup inválido")}},
  clearDemo:()=>{if(!confirm("Remover todas as instituições, reuniões e colaboradores marcados como DEMO?"))return;
    const ids=new Set(db.instituicoes.filter(i=>i.demo).map(i=>i.id));db.instituicoes=db.instituicoes.filter(i=>!i.demo);db.reunioes=db.reunioes.filter(m=>!m.demo&&!ids.has(m.instituicao_id));db.colaboradores=db.colaboradores.filter(c=>!c.demo);logAct("Removeu dados de demonstração","");persist();render(true);toast("Dados DEMO removidos")},
  resetDemo:()=>{if(!confirm("Apagar tudo e restaurar os dados de demonstração?"))return;db=seed();persist();S.user=resolveUser();S.f={};go("home")},
  locate:()=>{const g=n=>document.querySelector(`.ov [name="${n}"]`)?.value||"";const q=[g("endereco"),g("numero"),g("bairro"),"Pouso Alegre"].filter(Boolean).join(", ");window.open("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),"_blank","noopener");toast("Copie latitude e longitude do Google Maps para os campos")},
  gps:()=>{if(!navigator.geolocation){toast("GPS indisponível");return}navigator.geolocation.getCurrentPosition(p=>{document.querySelector('.ov [name="latitude"]').value=p.coords.latitude.toFixed(6);document.querySelector('.ov [name="longitude"]').value=p.coords.longitude.toFixed(6);toast("Coordenadas preenchidas")},()=>toast("Não foi possível obter a localização"))}
};
function admForm(k,r){const c=ADM[k];const fields=c.fields.map(f=>f.o?{...f,opts:f.o()}:f);
  openForm((r?"Editar ":"Adicionar ")+c.tit.toLowerCase(),fields,r?{...r}:{status:"ativo",uf:"MG"},o=>{
    ["setor_id","regiao_id","darpe_id"].forEach(x=>{if(x in o)o[x]=o[x]===""?"":+o[x]});
    if(k==="usuarios")o.perfil="admin";
    if(r){Object.assign(r,o);logAct("Editou em "+c.tit,o.nome||"")}else{o.id=nextId(c.t);T(c.t).push(o);logAct("Adicionou em "+c.tit,o.nome||"")}
    persist();render(true)})}

document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("ov")){e.target.remove();return}
  const c=e.target.closest("[data-close]");if(c){c.closest(".ov").remove();return}
  const a=e.target.closest("[data-act]");if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset,a)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("g[data-act],.h[data-act]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}if(e.key==="Enter"&&e.target.id==="loginpw"){e.preventDefault();A.doLogin()}if(e.key==="Escape")closeAll()});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("[data-f]")){const f=F(t.dataset.f);f[t.dataset.k]=t.value;
    if(t.dataset.k==="setor")f.sub="";if(t.dataset.k==="regiao")f.darpe="";
    if(t.dataset.k==="per"&&t.value){f.de="";f.ate=""}if((t.dataset.k==="de"||t.dataset.k==="ate")&&t.value)f.per="";
    render(true)}
  else if(t.matches("[data-tipo]")){S.p.tipo=t.value;S.rep=null;render(true)}
  else if(t.id==="themeToggle"){const dark=t.checked;document.documentElement.setAttribute("data-theme",dark?"dark":"light");try{localStorage.setItem(THEME_KEY,dark?"dark":"light")}catch(x){}}});
document.addEventListener("input",e=>{const t=e.target;if(t.matches("[data-fq]")){F(t.dataset.fq)[t.dataset.k]=t.value;refreshRes()}});
render();
</script>
</body>
</html>
